<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-label="金晟 JINSHENG">
  <defs>
    <linearGradient id="gShu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#b22b27"/>
      <stop offset="50%" stop-color="#c8362d"/>
      <stop offset="100%" stop-color="#8e1f1c"/>
    </linearGradient>
  </defs>

  <!-- ============== 円相（enso）外框 ============== -->
  <g transform="translate(120 110)" fill="none" stroke="url(#gShu)" stroke-linecap="round">
    <path d="M 0 -78
             C 38 -78, 74 -50, 78 -10
             C 82 30, 56 64, 18 76
             C -22 88, -58 70, -72 36
             C -86 0, -72 -38, -38 -64
             C -22 -76, -8 -78, 0 -78"
          stroke-width="6"/>
    <path d="M 18 76 C 22 78, 26 78, 30 76" stroke-width="3"/>
  </g>

  <!-- ============== 左侧风帆 ============== -->
  <g transform="translate(120 110)" fill="none" stroke="url(#gShu)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -78 -8
             C -100 8, -108 38, -94 62
             C -88 70, -80 72, -78 64"/>
    <path d="M -78 -8 C -88 12, -94 32, -90 50" stroke-width="3"/>
  </g>

  <!-- ============== 中央"金"字 ============== -->
  <g transform="translate(120 110)" fill="url(#gShu)">
    <path d="M -36 -60 L -2 -28 L 0 -28 L 36 -60 L 28 -60 L 0 -36 L -28 -60 Z"/>
    <path d="M -22 -30 L -22 24 C -22 28, -24 30, -28 30 L -18 30 C -16 30, -16 28, -16 24 L -16 -30 Z"/>
    <path d="M 16 -30 L 16 24 C 16 28, 18 30, 22 30 L 12 30 C 10 30, 10 28, 10 24 L 10 -30 Z"/>
    <path d="M -32 -4 L 32 -4 L 32 4 L -32 4 Z"/>
    <path d="M -36 -4 L -32 -8 L -32 6 L -36 4 Z"/>
    <path d="M 36 -4 L 32 -8 L 32 6 L 36 4 Z"/>
    <rect x="-14" y="10" width="28" height="6"/>
    <circle cx="-12" cy="32" r="5.5"/>
    <circle cx="12"  cy="32" r="5.5"/>
  </g>

  <!-- 右上角小星 -->
  <g transform="translate(176 50) scale(0.65)" fill="url(#gShu)">
    <path d="M 0 -10 L 2.5 -2.5 L 10 0 L 2.5 2.5 L 0 10 L -2.5 2.5 L -10 0 L -2.5 -2.5 Z"/>
  </g>

  <!-- ============== 底部青海波（下移到圆环外侧底部） ============== -->
  <g transform="translate(120 110)" fill="none" stroke="url(#gShu)" stroke-linecap="round">
    <path d="M -90 100 Q -68 84, -45 100 T 0 100 T 45 100 T 90 100" stroke-width="5"/>
    <path d="M -90 112 Q -68 96, -45 112 T 0 112 T 45 112 T 90 112" stroke-width="3"/>
  </g>

  <!-- ============== 中文字标（下移到波纹下方留间距） ============== -->
  <text x="120" y="270" text-anchor="middle"
        font-family="'Noto Serif JP','Yu Mincho','Hiragino Mincho ProN','Songti SC','SimSun',serif"
        font-weight="700" font-size="30" letter-spacing="8"
        fill="#1a1a1a">金晟</text>

  <line x1="56"  y1="290" x2="94"  y2="290" stroke="#8e1f1c" stroke-width="1"/>
  <line x1="146" y1="290" x2="184" y2="290" stroke="#8e1f1c" stroke-width="1"/>

  <text x="120" y="305" text-anchor="middle"
        font-family="'Noto Serif JP','Yu Mincho','Times New Roman',serif"
        font-weight="400" font-size="11" letter-spacing="6"
        fill="#1a1a1a">JINSHENG</text>
</svg>
