<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f2">
  <meta name="description" content="金晟 SUPERDREAM 超级梦想 - 中国积木潮玩。A系列极致奢华版 / B系列第一季，樱花物语・星空・咖啡屋，任意组合无限延展。">
  <title>SUPERDREAM 超级梦想 ・ 金晟积木</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- 自定義 -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- 頂部導航 -->
  <header class="app-header">
    <div class="brand">
      <img class="brand-logo-img" src="assets/images/logo.svg" alt="金晟 JINSHENG">
      <span class="brand-sub">SUPERDREAM</span>
    </div>
    <button class="lang-switch" id="langSwitch" aria-label="Switch language">
      <i class="bi bi-translate"></i> <span id="langSwitchText">JA</span>
    </button>
  </header>

  <main>
    <!-- Hero -->
    <section class="hero">
      <p class="hero-jp">DARE TO LOVE, DARE TO FIGHT, DARE TO DREAM.</p>
      <div class="hero-image">
        <img src="assets/images/products/b-01-sakura-promise.jpg" alt="SUPERDREAM Hero">
        <div class="hero-stamp">梦</div>
      </div>
    </section>

    <!-- 系列 + 商品 -->
    <section id="collection">
      <div class="chip-bar" role="tablist">
        <button class="chip active" data-cat="A">A 系列 <span class="jp">A シリーズ</span></button>
        <button class="chip" data-cat="B">B 系列 <span class="jp">B シリーズ</span></button>
        <button class="chip" data-cat="sakura">樱花物语 <span class="jp">桜物語</span></button>
        <button class="chip" data-cat="starry">星空 <span class="jp">星空</span></button>
        <button class="chip" data-cat="coffee">咖啡屋 <span class="jp">コーヒー</span></button>
      </div>

      <div class="product-grid" id="productGrid">
        <!-- JS 動態渲染 -->
      </div>
    </section>

    <!-- PDF 末尾品牌口号（来自图册最后一页）-->
    <section class="about-block">
      <p class="ja">— 金 晟 ・ 超 级 梦 想 —</p>
      <p class="about-slogan">中国积木潮玩 · 任意组合 无限延展</p>
      <p class="about-jp">DARE TO LOVE, DARE TO FIGHT, DARE TO DREAM.</p>
    </section>
  </main>

  <!-- 頁腳 -->
  <footer class="app-footer">
    <div class="logo">SUPERDREAM</div>
    <p class="copy">© 2026 金晟积木</p>
  </footer>

  <!-- 底部導航 -->
  <nav class="bottom-nav" aria-label="底部導航">
    <button class="nav-item active" aria-label="首頁"><i class="bi bi-house-door"></i><span data-i18n="navHome">首頁</span></button>
    <button class="nav-item" id="navContact" aria-label="客服"><i class="bi bi-chat-dots"></i><span data-i18n="navCustomer">客服</span></button>
  </nav>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
