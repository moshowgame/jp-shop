<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2e9">
  <meta name="description" content="聯繫金晟 SUPERDREAM — 掃碼添加 LINE / WeChat，告知想要的系列與風格即可。">
  <title>聯繫我們 — SUPERDREAM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=5">
</head>
<body>

  <!-- 顶部栏 -->
  <div class="gallery-topbar">
    <button class="back-btn" id="btnBack">
      <i class="bi bi-chevron-left"></i><span data-i18n="back">返回</span>
    </button>
    <div class="crumb"><span data-i18n="contactTitle">聯 繫 我 們</span></div>
    <button class="lang-btn" id="langSwitch" aria-label="言語切替">
      <i class="bi bi-translate"></i><span id="langSwitchText">JA</span>
    </button>
  </div>

  <main class="contact-page">
    <!-- 咨询上下文（从图集页带过来时显示） -->
    <div class="contact-context" id="contactContext" style="display:none;">
      <div class="seal">詢</div>
      <p class="kicker" data-i18n="ctxKicker">您 正 在 諮 詢</p>
      <p class="series-name" id="ctxSeries"></p>
      <p class="theme-name" id="ctxTheme"></p>
      <p class="hint" data-i18n="ctxHint">添加好友後，直接告知客服即可</p>
    </div>

    <!-- LINE -->
    <h2 class="contact-section-title" data-i18n="qrSectionTitle">掃 碼 添 加 好 友</h2>

    <div class="qr-card">
      <div class="app-head">
        <div class="app-icon line"><i class="bi bi-line"></i></div>
        <p class="app-name">LINE</p>
      </div>
      <img class="qr-img" src="assets/images/line-qr.jpg" alt="LINE QR Code">
      <p class="app-desc" data-i18n="lineDesc">掃碼添加 LINE 好友 ・ 獲取最新產品資訊</p>
    </div>

    <!-- WeChat -->
    <div class="qr-card">
      <div class="app-head">
        <div class="app-icon wechat"><i class="bi bi-wechat"></i></div>
        <p class="app-name">WeChat <span style="font-size:12px;color:var(--ink-soft);">微信</span></p>
      </div>
      <img class="qr-img" src="assets/images/wechat-qr.jpg" alt="WeChat QR Code">
      <p class="app-desc" data-i18n="wechatDesc">日本 大阪市 ・ 張先生</p>
    </div>

    <!-- 使用说明 -->
    <div class="contact-guide">
      <p class="title" data-i18n="guideTitle">購 買 方 式</p>
      <p data-i18n="guideText">長按或截圖保存二維碼，打開對應 APP 掃描添加好友。<br>添加後發送您想要的「系列 + 風格」即可：</p>
      <p class="example" id="guideExample">「我想要 A 系列的櫻花物語」</p>
    </div>
  </main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <p class="brand-mark">金 晟 SUPERDREAM</p>
    <p class="slogan">DARE TO LOVE, DARE TO FIGHT, DARE TO DREAM</p>
    <p class="copy">© 2026 金晟 ・ ALL RIGHTS RESERVED BY LHE ENTERTAINMENT</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="assets/js/data.js?v=5"></script>
  <script src="assets/js/i18n.js?v=5"></script>
  <script>
    (function ($) {
      const { getCollection, getSeries, t } = window.JP_SHOP_DATA;
      const { getLang, t: tUi } = window.JP_SHOP_I18N;
      const lang = getLang();
      const isJa = lang === 'ja';

      document.documentElement.setAttribute('lang', isJa ? 'ja' : 'zh-Hant');
      document.title = (isJa ? 'お問い合わせ' : '聯繫我們') + ' — SUPERDREAM';
      $('#langSwitchText').text(isJa ? '中' : 'JA');

      // i18n
      $('[data-i18n]').each(function () {
        $(this).html(tUi($(this).data('i18n')));
      });

      // 上下文
      const params = new URLSearchParams(location.search);
      const c = getCollection(params.get('c'));
      if (c) {
        const s = getSeries(c.series);
        $('#ctxSeries').text(isJa ? `${s.id}シリーズ ・ ${t(s, 'name', lang)}` : `${s.id}系列 ・ ${t(s, 'name', lang)}`);
        $('#ctxTheme').text(isJa ? `風格：${t(c, 'name', lang)}` : `風格：${t(c, 'name', lang)}`);
        $('#contactContext').show();
        $('#guideExample').text(isJa
          ? `「${s.id}シリーズの${t(c, 'nameJa', lang)}が欲しいです」`
          : `「我想要 ${s.id} 系列的${t(c, 'name', lang)}」`);
      }

      // 返回
      $('#btnBack').on('click', function () {
        if (document.referrer && document.referrer.indexOf(location.host) !== -1) {
          history.back();
        } else {
          location.href = isJa ? 'index.html?lang=ja' : 'index.html';
        }
      });

      // 语言切换
      $('#langSwitch').on('click', function () {
        const url = new URL(location.href);
        if (isJa) url.searchParams.delete('lang');
        else url.searchParams.set('lang', 'ja');
        location.href = url.toString();
      });
    })(jQuery);
  </script>
</body>
</html>
