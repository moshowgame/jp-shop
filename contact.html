<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f2">
  <meta name="description" content="聯繫匠物 — 掃碼添加 LINE / WeChat，開啟日系好物之旅。">
  <title>聯繫我們 — 匠物</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- 自定義 -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="detail-page">
    <!-- 頂部 banner（縮小，留出内容空间） -->
    <section class="contact-banner">
      <button class="detail-back" id="detailBack" aria-label="返回">
        <i class="bi bi-chevron-left"></i>
      </button>
    </section>

    <section class="detail-body">
      <p class="contact-eyebrow">— お 問 合 せ —</p>
      <h1 class="contact-title">聯繫匠物</h1>
      <p class="contact-sub">お気軽にご連絡ください</p>

      <p class="contact-lead">走訪京都、東京、金澤的百年工坊，<br>只為為你挑選那些能為日常帶來儀式感的小物。</p>

      <!-- 支付寶 -->
      <div class="contact-card">
        <div class="contact-head">
          <div class="contact-icon alipay">
            <i class="bi bi-credit-card-2-front"></i>
          </div>
          <div class="contact-info">
            <h4>支付寶掃碼</h4>
            <p>打開支付寶 APP 掃碼下單或諮詢</p>
          </div>
        </div>
        <div class="contact-qr">
          <img src="assets/images/alipay-qr.jpg" alt="支付寶二維碼">
        </div>
      </div>

      <!-- 微信支付 -->
      <div class="contact-card">
        <div class="contact-head">
          <div class="contact-icon wechat">
            <i class="bi bi-wechat"></i>
          </div>
          <div class="contact-info">
            <h4>微信支付</h4>
            <p>打開微信掃碼完成支付 / 添加好友</p>
          </div>
        </div>
        <div class="contact-qr">
          <img src="assets/images/wechat-qr.jpg" alt="微信二維碼">
        </div>
      </div>

      <p class="contact-tip">
        <i class="bi bi-info-circle"></i>
        長按或截圖保存二維碼，打開對應 APP 掃描即可
      </p>

      <div class="contact-divider">其 他 方 式</div>
      <div class="contact-actions">
        <a href="mailto:hello@jp-shop.example.com"><i class="bi bi-envelope"></i> Email</a>
        <a href="#" onclick="return false;"><i class="bi bi-instagram"></i> Instagram</a>
        <a href="#" onclick="return false;"><i class="bi bi-facebook"></i> Facebook</a>
      </div>

      <p class="contact-note">※ 工作日 10:00 – 19:00 回覆</p>
    </section>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // 返回按鈕
    document.getElementById('detailBack').addEventListener('click', function () {
      if (document.referrer && document.referrer.indexOf(location.host) !== -1) {
        history.back();
      } else {
        location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
