<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#faf7f2">
  <title>商品詳情 — 匠物</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- 自定義 -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main id="detailContent" class="detail-page">
    <!-- 圖片畫廊 -->
    <section class="detail-gallery">
      <button class="detail-back" id="detailBack" aria-label="返回">
        <i class="bi bi-chevron-left"></i>
      </button>
      <img class="main-img" id="mainImage" src="" alt="">
      <div class="thumbs" id="thumbs"></div>
    </section>

    <!-- 商品信息 -->
    <section class="detail-body">
      <div class="detail-tags" id="detailTags"></div>
      <h1 class="detail-name" id="detailName"></h1>
      <p class="detail-name-ja" id="detailNameJa"></p>

      <div class="detail-price">
        <span class="num" id="detailPrice"></span>
        <span class="tag">含 税 ・ 匠 物 直 送</span>
      </div>

      <div class="detail-spec" id="detailSpec"></div>

      <div class="detail-section">
        <p class="ja">— 商 品 紹 介 —</p>
        <h4>工藝故事</h4>
        <div id="detailDesc"></div>
      </div>

      <!-- 相關推薦 -->
      <section class="recommend">
        <h4>您可能也喜歡</h4>
        <div class="reco-grid" id="recommendGrid"></div>
      </section>
    </section>
  </main>

  <!-- 底部 CTA -->
  <div class="detail-cta">
    <button class="btn-contact" id="btnContact">
      <i class="bi bi-chat-dots"></i> 聯 繫 店 鋪
    </button>
    <button class="btn-buy" id="btnBuy">
      <i class="bi bi-bag-heart"></i> 立 即 購 買
    </button>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/product.js"></script>
</body>
</html>
