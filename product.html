<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2e9">
  <title>ギャラリー — SUPERDREAM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=5">
</head>
<body>

  <!-- 顶部栏 -->
  <div class="gallery-topbar">
    <button class="back-btn" id="btnBack">
      <i class="bi bi-chevron-left"></i><span data-i18n="back">戻る</span>
    </button>
    <div class="crumb">
      <span class="series-tag" id="crumbSeries"></span>
      <span id="crumbTheme"></span>
    </div>
    <a class="ask-btn" id="btnAsk" href="contact.html">
      <span data-i18n="askShort">相談</span>
    </a>
  </div>

  <main>
    <!-- 主题头部 -->
    <section class="gallery-hero">
      <p class="theme-icon" id="themeIcon">❀</p>
      <h1 id="themeName"></h1>
      <p class="sub" id="themeSub"></p>
      <p class="series-line" id="seriesLine"></p>
    </section>

    <!-- 画作列表（JS 渲染） -->
    <div class="gallery-list" id="galleryList"></div>

    <!-- 底部咨询 -->
    <section class="gallery-cta">
      <p class="kicker">CONTACT</p>
      <h2 data-i18n="galleryCtaTitle">こちらがお好きですか？</h2>
      <p class="lead" data-i18n="galleryCtaLead">QRコードからサポートに連絡して、欲しいシリーズとスタイルをお知らせください</p>
      <a class="cta-btn" id="btnAskBottom" href="contact.html">
        <i class="bi bi-chat-dots"></i><span data-i18n="ctaBtn">お 問 い 合 わ せ</span>
      </a>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="site-footer">
    <p class="brand-mark">金 晟 SUPERDREAM</p>
    <p class="slogan">DARE TO LOVE, DARE TO FIGHT, DARE TO DREAM</p>
    <p class="copy">© 2026 金晟 ・ ALL RIGHTS RESERVED BY LHE ENTERTAINMENT</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="assets/js/data.js?v=6"></script>
  <script src="assets/js/i18n.js?v=6"></script>
  <script src="assets/js/product.js?v=6"></script>
</body>
</html>
